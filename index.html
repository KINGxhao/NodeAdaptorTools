<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编号去重格式化工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-labelledby="page-title">
      <header class="masthead">
        <div>
          <p class="eyebrow">去重 / 统计 / 转格式</p>
          <h1 id="page-title">编号去重格式化工具</h1>
        </div>
        <button class="ghost-button" id="loadSample" type="button">载入示例</button>
      </header>

      <div class="tool-grid">
        <section class="panel input-panel" aria-labelledby="input-title">
          <div class="panel-header">
            <div>
              <h2 id="input-title">原始内容</h2>
              <p>可粘贴多行数字，或类似 *18982728* ,*18982740* 的内容。</p>
            </div>
            <button class="text-button" id="clearInput" type="button">清空</button>
          </div>
          <textarea id="sourceInput" spellcheck="false" placeholder="粘贴编号内容"></textarea>
          <div class="actions">
            <button class="primary-button" id="processButton" type="button">去重统计</button>
          </div>
        </section>

        <aside class="panel stats-panel" aria-labelledby="stats-title">
          <h2 id="stats-title">统计</h2>
          <dl class="stats-list">
            <div>
              <dt>提取数量</dt>
              <dd id="totalCount">0</dd>
            </div>
            <div>
              <dt>去重数量</dt>
              <dd id="uniqueCount">0</dd>
            </div>
            <div>
              <dt>重复数量</dt>
              <dd id="duplicateCount">0</dd>
            </div>
          </dl>
          <p class="status" id="statusText" role="status">等待输入。</p>
        </aside>
      </div>

      <section class="result-grid" aria-label="处理结果">
        <article class="panel result-panel">
          <div class="panel-header compact">
            <div>
              <h2>多行结果</h2>
              <p>每行一个编号。</p>
            </div>
            <button class="copy-button" data-copy="lineOutput" type="button">复制</button>
          </div>
          <textarea id="lineOutput" spellcheck="false" readonly></textarea>
        </article>

        <article class="panel result-panel">
          <div class="panel-header compact">
            <div>
              <h2>目标格式</h2>
              <p>*编号* ,*编号*。</p>
            </div>
            <button class="copy-button" data-copy="targetOutput" type="button">复制</button>
          </div>
          <textarea id="targetOutput" spellcheck="false" readonly></textarea>
        </article>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
